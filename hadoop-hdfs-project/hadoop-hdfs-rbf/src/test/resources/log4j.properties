hadoop.metrics.logger=INFO,RFAMETRIC
hadoop.metrics.log.file=metric.log
hadoop.metrics.log.maxfilesize=256MB
hadoop.metrics.log.maxbackupindex=20
log4j.logger.org.apache.hadoop.metrics2.sink.Slf4jSink=${hadoop.metrics.logger}
log4j.additivity.org.apache.hadoop.metrics2.sink.Slf4jSink=false
log4j.appender.RFAMETRIC=org.apache.log4j.RollingFileAppender
log4j.appender.RFAMETRIC.File=${hadoop.log.dir}/${hadoop.metrics.log.file}
log4j.appender.RFAMETRIC.layout=org.apache.log4j.PatternLayout
log4j.appender.RFAMETRIC.layout.ConversionPattern=%m%n
log4j.appender.RFAMETRIC.MaxFileSize=${hadoop.metrics.log.maxfilesize}
log4j.appender.RFAMETRIC.MaxBackupIndex=${hadoop.metrics.log.maxbackupindex}



log4j.logger.DELETE=INFO,DELETE
log4j.logger.DELETE.log.file=DELETE.txt
log4j.logger.DELETE.log.maxfilesize=256MB
log4j.logger.DELETE.log.maxbackupindex=20
log4j.appender.DELETE=org.apache.log4j.RollingFileAppender
log4j.appender.DELETE.File=${hadoop.log.dir}/DELETE.txt
log4j.appender.DELETE.layout=org.apache.log4j.PatternLayout
log4j.appender.DELETE.layout.ConversionPattern=%d{ISO8601} %-5p [%t] (%F:%M(%L)) - %m%n
log4j.appender.DELETE.MaxFileSize=${hadoop.metrics.log.maxfilesize}
log4j.appender.DELETE.MaxBackupIndex=${hadoop.metrics.log.maxbackupindex}