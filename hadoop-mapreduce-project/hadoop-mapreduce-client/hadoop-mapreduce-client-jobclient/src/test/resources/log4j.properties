# Define some default values that can be overridden by system properties
# To change daemon root logger use hadoop_root_logger in hadoop-env
hadoop.root.logger=INFO,console

# Define the root logger to the system property "hadoop.root.logger".
log4j.rootLogger=${hadoop.root.logger}, EventCounter
# Logging Threshold
log4j.threshhold=ALL

#
# console
# Add "console" to rootlogger above if you want to use this
#
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} [%r] - %-5p [%t:%C{1}@%L] - %m%n

#
# Event Counter Appender
# Sends counts of logging messages at different severity levels to Hadoop Metrics.
#
log4j.appender.EventCounter=org.apache.hadoop.log.metrics.EventCounter

#
#Security audit appender
#
hadoop.security.logger=INFO,console
hadoop.security.log.maxfilesize=256MB
hadoop.security.log.maxbackupindex=20
log4j.category.SecurityLogger=${hadoop.security.logger}
hadoop.security.log.file=security-${hadoop.log.file}
log4j.appender.DRFAS=org.apache.log4j.DailyRollingFileAppender
log4j.appender.DRFAS.File=${hadoop.log.dir}/${hadoop.security.log.file}
log4j.appender.DRFAS.layout=org.apache.log4j.PatternLayout
log4j.appender.DRFAS.layout.ConversionPattern=%d{ISO8601} [%r] - %-5p [%t:%C{1}@%L] - %m%n
log4j.appender.DRFAS.DatePattern=.yyyy-MM-dd
log4j.appender.RFAS=org.apache.log4j.RollingFileAppender
log4j.appender.RFAS.File=${hadoop.log.dir}/${hadoop.security.log.file}
log4j.appender.RFAS.layout=org.apache.log4j.PatternLayout
log4j.appender.RFAS.layout.ConversionPattern=%d{ISO8601} [%r] - %-5p [%t:%C{1}@%L] - %m%n
log4j.appender.RFAS.MaxFileSize=${hadoop.security.log.maxfilesize}
log4j.appender.RFAS.MaxBackupIndex=${hadoop.security.log.maxbackupindex}

#
# Rolling File Appender
#
log4j.appender.RFA=org.apache.log4j.RollingFileAppender
log4j.appender.RFA.File=${hadoop.log.dir}/${hadoop.log.file}
# Logfile size and and 30-day backups
log4j.appender.RFA.MaxFileSize=256MB
log4j.appender.RFA.MaxBackupIndex=20
log4j.appender.RFA.layout=org.apache.log4j.PatternLayout
log4j.appender.RFA.layout.ConversionPattern=%d{ISO8601} [%r] - %-5p [%t:%C{1}@%L] - %m%n

#
# hadoop metrics slf4j sink logger
#
hadoop.metrics.logger=INFO,RFAMETRIC
hadoop.metrics.log.file=metric-${hadoop.log.file}
hadoop.metrics.log.maxfilesize=256MB
hadoop.metrics.log.maxbackupindex=20
log4j.logger.org.apache.hadoop.metrics2.sink.Slf4jSink=${hadoop.metrics.logger}
log4j.logger.org.apache.hadoop.metrics2.sink.Slf4jJsonSink=${hadoop.metrics.logger}
log4j.additivity.org.apache.hadoop.metrics2.sink.Slf4jJsonSink=false
log4j.additivity.org.apache.hadoop.metrics2.sink.Slf4jSink=false
log4j.appender.RFAMETRIC=org.apache.log4j.RollingFileAppender
log4j.appender.RFAMETRIC.File=${hadoop.log.dir}/${hadoop.metrics.log.file}
log4j.appender.RFAMETRIC.layout=org.apache.log4j.PatternLayout
log4j.appender.RFAMETRIC.layout.ConversionPattern=${log4j.appender.RFAMETRIC.layout.ConversionPattern}
log4j.appender.RFAMETRIC.MaxFileSize=${hadoop.metrics.log.maxfilesize}
log4j.appender.RFAMETRIC.MaxBackupIndex=${hadoop.metrics.log.maxbackupindex}